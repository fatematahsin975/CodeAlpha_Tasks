<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>Language Translation Tool</h1>
        <p class="subtitle">Translate text using Microsoft Translator API</p>
      </div>

      <!-- Main Content -->
      <div class="card">
        <!-- Language Selection -->
        <div class="language-selector">
          <div class="language-group">
            <label for="sourceLanguage">Source Language</label>
            <select id="sourceLanguage">
              <!-- Options will be populated by JavaScript -->
            </select>
          </div>

          <!-- Swap Button -->
          <button id="swapBtn" class="swap-btn" title="Swap languages">
            ⇅
          </button>

          <div class="language-group">
            <label for="targetLanguage">Target Language</label>
            <select id="targetLanguage">
              <!-- Options will be populated by JavaScript -->
            </select>
          </div>
        </div>

        <!-- Input and Output -->
        <div class="content-area">
          <!-- Source Text -->
          <div class="text-box">
            <label for="sourceText">Text to Translate</label>
            <textarea
              id="sourceText"
              placeholder="Enter text to translate..."
              maxlength="2000"
            ></textarea>
            <div class="char-counter">
              <span id="charCount">0</span> / <span>2000</span>
            </div>
            <button id="readSourceBtn" class="secondary-btn">
              🔊 Read Aloud
            </button>
          </div>

          <!-- Translated Text -->
          <div class="text-box">
            <label for="translatedText">Translation</label>
            <textarea
              id="translatedText"
              placeholder="Translation will appear here..."
              readonly
            ></textarea>
            <div class="button-group">
              <button id="copyBtn" class="secondary-btn">
                📋 Copy Translation
              </button>
              <button id="readTranslatedBtn" class="secondary-btn">
                🔊 Read Aloud
              </button>
            </div>
          </div>
        </div>

        <!-- Error/Success Message -->
        <div id="message" class="message hidden"></div>

        <!-- Action Buttons -->
        <div class="button-group primary">
          <button id="translateBtn" class="btn btn-primary">
            Translate
          </button>
          <button id="clearBtn" class="btn btn-secondary">Clear</button>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading hidden">
          <div class="spinner"></div>
          <p>Translating...</p>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <p>Maximum 2000 characters per translation</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
